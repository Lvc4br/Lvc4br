<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Luca Toniolo — Software, Creative Technology and 3D</title>
  <desc id="desc">Dark graphite banner with abstract geometric lines, a blue-violet gradient and a technical grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset=".58" stop-color="#141b2a"/>
      <stop offset="1" stop-color="#211b38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58c5e8"/>
      <stop offset=".52" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#c18cff"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9aa9c4" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="26" fill="url(#grid)"/>
  <circle cx="1280" cy="115" r="170" fill="#6557d9" opacity=".24" filter="url(#blur)"/>
  <circle cx="1450" cy="340" r="130" fill="#39a8c9" opacity=".17" filter="url(#blur)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".75">
    <path d="M1030 420 1290 65l210 0 100 140"/>
    <path d="M1120 420 1370 105l230 0"/>
    <path d="M1260 420 1480 170l120 0"/>
    <circle cx="1370" cy="205" r="112" stroke-opacity=".5"/>
    <circle cx="1370" cy="205" r="72" stroke-opacity=".36"/>
    <path d="M1370 65v280M1230 205h280" stroke-opacity=".28"/>
  </g>
  <g fill="#dce7f8" opacity=".72">
    <circle cx="1290" cy="65" r="4"/><circle cx="1500" cy="65" r="4"/>
    <circle cx="1370" cy="205" r="5"/><circle cx="1600" cy="205" r="4"/>
  </g>
  <g transform="translate(104 104)">
    <rect x="0" y="0" width="5" height="212" rx="2.5" fill="url(#accent)"/>
    <text x="34" y="72" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.8">LUCA TONIOLO</text>
    <text x="36" y="119" fill="#b7c5da" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" letter-spacing="3.2">SOFTWARE  /  CREATIVE TECHNOLOGY  /  3D</text>
    <path d="M36 151h410" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
    <text x="36" y="190" fill="#91a3bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="1.2">BUILDING · EXPERIMENTING · LEARNING</text>
  </g>
  <text x="1490" y="380" fill="#93a4bd" opacity=".7" font-family="ui-monospace,Consolas,monospace" font-size="14" text-anchor="end">LVC4BR / PROFILE</text>
</svg>